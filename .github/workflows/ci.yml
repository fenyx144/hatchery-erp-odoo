name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.9.10
      - run: ruff check analytics connector simulator

  wp01:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Levantar servicios y comprobar salud
        run: |
          make up
          curl -f https://localhost/api/v1/health
          docker compose ps
