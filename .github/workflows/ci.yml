name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.9.10 pylint-odoo==9.3.4
      - run: ruff check analytics connector simulator
      - name: pylint-odoo de hatchery_base
        run: >
          pylint --load-plugins=pylint_odoo --valid-odoo-versions=18.0
          --disable=all --enable=odoolint,manifest-required-author,xml-syntax-error
          addons/hatchery_base

  wp01:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Levantar servicios y comprobar salud
        run: |
          make up
          curl -f --cacert secrets/dev-ca.crt https://localhost/api/v1/health
          docker compose ps
      - name: Logs si un paso falló
        if: failure()
        run: docker compose logs --no-color

  wp02:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas de hatchery_base
        run: |
          docker run --rm --network host \
            -v "$PWD/addons:/mnt/extra-addons" \
            -e HOST=127.0.0.1 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            odoo:18.0 \
            odoo -d test --test-enable --stop-after-init -i hatchery_base --test-tags /hatchery_base
